name: Landing page
# Publishes the public landing page (web/public/welcome) to GitHub Pages at bot.swk.tools, apart from
# anyone's own Threebot. The page keeps its /welcome/... paths, with a copy at the root.
on:
  push:
    branches: [main]
    paths: ["web/public/welcome/**", "web/src/landing/**", "install.sh", ".github/workflows/landing.yml"]
  workflow_dispatch:
  # Redeploy after each release so the page's fallback release version is the new one.
  workflow_run:
    workflows: [Release]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      # The ball's live animation is built from web/src/landing.
      - run: npm run build:ball --prefix web
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R web/public/welcome _site/welcome
          cp web/public/welcome/index.html _site/index.html
          cp install.sh _site/install.sh
          # Retires the old app's service worker in browsers that visited bot.swk.tools when it was a Threebot.
          cp web/src/landing/sw-reset.js _site/sw.js
          printf 'bot.swk.tools\n' > _site/CNAME
          touch _site/.nojekyll
      # The page reads the latest release live; this writes it in too, for when GitHub can't be reached.
      - name: Write in the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null | sed 's/^v//')" || true
          if printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            sed -i "s|<b data-release-name>Threebot [^<]*</b>|<b data-release-name>Threebot $version</b>|" _site/index.html _site/welcome/index.html
            grep -c "Threebot $version</b>" _site/index.html
          else
            echo "No latest release found; keeping the version in the page."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
