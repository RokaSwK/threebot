name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            server/package-lock.json
      - name: Tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match package.json $version"; exit 1; }
      - run: npm run setup
      - run: npm run check
      - run: node scripts/pack-release.mjs --out release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/SHA256SUMS --title "Threebot ${GITHUB_REF_NAME#v}" --generate-notes $prerelease
