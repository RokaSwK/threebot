name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            server/package-lock.json
      - name: Tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match package.json $version"; exit 1; }
      - run: npm run setup
      - run: npm run check
      - run: node scripts/pack-release.mts --out release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/SHA256SUMS release/install.ps1 --title "Threebot ${GITHUB_REF_NAME#v}" --generate-notes $prerelease

  release-windows:
    needs: release-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            server/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/launcher/go.mod
          cache: false
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Install dependencies & build web
        run: |
          npm ci --prefix web
          npm run build --prefix web
          npm ci --prefix server
      - name: Build Windows bundle and installer
        run: |
          powershell -ExecutionPolicy Bypass -File windows/build-installer.ps1
      - name: Upload Windows assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          $assets = @(
            "dist\windows\Threebot-$version-win64.zip",
            "dist\windows\Threebot-Setup-$version.exe"
          )
          gh release upload "$env:GITHUB_REF_NAME" @assets --clobber
