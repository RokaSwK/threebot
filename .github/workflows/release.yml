name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            server/package-lock.json
      - name: Tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match package.json $version"; exit 1; }
      - run: npm run setup
      - run: npm run check
      - run: node scripts/pack-release.mts --out release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/SHA256SUMS release/install.ps1 --title "Threebot ${GITHUB_REF_NAME#v}" --generate-notes $prerelease

  # The Windows installer and portable bundle, attached to the release the job above published. It
  # runs after that job, so a Windows failure never holds back the tarball and SHA256SUMS.
  release-windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # This node.exe ships inside the bundle and the installer: pin it.
          node-version: 24.22.3
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            server/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.27.4 # builds the shipped Threebot.exe; go.mod's 1.21 is only the minimum
          cache: false
      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 -y --no-progress
      - name: Install dependencies and build the web app
        run: |
          npm ci --prefix web
          npm run build --prefix web
          npm ci --prefix server
      - name: Build the Windows bundle and installer
        run: powershell -ExecutionPolicy Bypass -File windows/build-installer.ps1
      - name: Upload the Windows assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          $assets = @("dist\windows\Threebot-$version-win64.zip", "dist\windows\Threebot-Setup-$version.exe")
          $sums = foreach ($asset in $assets) { "$((Get-FileHash $asset -Algorithm SHA256).Hash.ToLower())  $(Split-Path -Leaf $asset)" }
          [System.IO.File]::WriteAllText("$PWD\dist\windows\SHA256SUMS-windows", (($sums -join "`n") + "`n"))
          gh release upload "$env:GITHUB_REF_NAME" @assets "dist\windows\SHA256SUMS-windows" --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
